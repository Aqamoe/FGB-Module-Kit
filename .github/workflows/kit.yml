name: kit

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 / 自测
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 脚本语法检查
        shell: pwsh
        run: |
          Get-ChildItem tools/*.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($_.Name) 语法错误" }
          }

      - name: 配置
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: 构建
        run: cmake --build build --config Release --parallel

      - name: 自测
        run: ctest --test-dir build -C Release --output-on-failure

      - name: 形状名表与锁定 SDK 一致
        shell: pwsh
        run: |
          node tools/gen_shape_names.mjs --check --sdk=build/_deps/facegaze_sdk-src
          if ($LASTEXITCODE -ne 0) { throw "shape_names.hpp 与 SDK 不一致" }

      - name: 自检仓库
        shell: pwsh
        run: node tools/audit.mjs --dir .

  release:
    name: 发布 Kit 归档
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --generate-notes
